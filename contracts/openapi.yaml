openapi: 3.0.3
info:
  title: Zhijiao Golden Demo V2 Foundation API
  version: 0.1.0
  description: Technical foundation contract. Business endpoints are added by later tasks.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Foundation health check
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeHealthStatus'
  /student/learning-state:
    get:
      operationId: getStudentLearningState
      summary: Read derived student learning state
      description: Returns T02 algorithm-derived state; the frontend does not calculate mastery.
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
        - name: knowledgePointId
          in: query
          required: false
          schema:
            type: string
        - name: studentId
          in: query
          required: false
          description: Demo context override; authenticated deployments derive this from the current user.
          schema:
            type: string
      responses:
        '200':
          description: Derived learning state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeLearningStateResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /student/growth:
    get:
      operationId: getStudentGrowth
      summary: Read the student growth foundation read model
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
        - name: studentId
          in: query
          required: false
          description: Demo context override; authenticated deployments derive this from the current user.
          schema:
            type: string
      responses:
        '200':
          description: Growth read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeGrowthReadModel'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /student/coach/sessions:
    post:
      operationId: createCoachSession
      summary: Create an AI Coach session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoachSessionRequest'
      responses:
        '200':
          description: Coach session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeCoachSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /student/coach/sessions/{sessionId}:
    get:
      operationId: getCoachSession
      summary: Recover an AI Coach session
      parameters:
        - $ref: '#/components/parameters/CoachSessionId'
      responses:
        '200':
          description: Coach session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeCoachSessionResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /student/coach/sessions/{sessionId}/messages:
    post:
      operationId: sendCoachMessage
      summary: Send a student message to AI Coach
      parameters:
        - $ref: '#/components/parameters/CoachSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachMessageRequest'
      responses:
        '200':
          description: Coach response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeCoachMessageResponse'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '502':
          $ref: '#/components/responses/AiUpstreamError'
        '503':
          $ref: '#/components/responses/RagUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /student/coach/sessions/{sessionId}/diagnostic-sets:
    post:
      operationId: generateDiagnosticSet
      summary: Generate exactly two structured diagnostic questions
      parameters:
        - $ref: '#/components/parameters/CoachSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticSetRequest'
      responses:
        '200':
          description: Structured diagnostic set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDiagnosticSetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/LlmOutputInvalid'
  /admin/knowledge/documents:
    post:
      operationId: ingestKnowledgeDocument
      summary: Ingest and index a text course document
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
          multipart/form-data:
            schema:
              type: object
              required: [courseId, file]
              properties:
                courseId: {type: string}
                knowledgePointId: {type: string}
                title: {type: string}
                sourceVersion: {type: string}
                dataOrigin: {type: string}
                file: {type: string, format: binary}
      responses:
        '200':
          description: Indexed document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeKnowledgeDocumentResponse'
    get:
      operationId: listKnowledgeDocuments
      summary: List course knowledge documents
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeKnowledgeDocumentListResponse'
  /demo/runs:
    post:
      operationId: createDemoRun
      summary: Create a deterministic demo run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDemoRunRequest'
      responses:
        '200':
          description: Demo run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeCreateDemoRunResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /demo/runs/{demoRunId}:
    get:
      operationId: getDemoRun
      summary: Query demo run state
      parameters:
        - $ref: '#/components/parameters/DemoRunId'
      responses:
        '200':
          description: Demo run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDemoRunResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /demo/runs/{demoRunId}/reset:
    post:
      operationId: resetDemoRun
      summary: Reset a demo run
      parameters:
        - $ref: '#/components/parameters/DemoRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New active demo run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeResetDemoRunResponse'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /analytics/demo-traces/{demoCaseId}:
    get:
      operationId: getDemoTrace
      summary: Query demo run trace
      parameters:
        - name: demoCaseId
          in: path
          required: true
          schema:
            type: string
        - name: demoRunId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Demo trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDemoRunTrace'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
components:
  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, requestId, data, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        data:
          nullable: true
        details:
          $ref: '#/components/schemas/ErrorDetails'
        timestamp:
          type: string
          format: date-time
    ErrorDetails:
      type: object
      nullable: true
      additionalProperties: true
    ApiEnvelopeHealthStatus:
      type: object
      required: [code, message, requestId, data, timestamp]
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        requestId:
          type: string
          example: req-01J
        data:
          $ref: '#/components/schemas/HealthStatus'
        details:
          $ref: '#/components/schemas/ErrorDetails'
        timestamp:
          type: string
          format: date-time
    CreateDemoRunRequest:
      type: object
      required: [demoCaseId, baselineVersion]
      properties:
        demoCaseId:
          type: string
          example: DEMO-GRAPH-001
        baselineVersion:
          type: string
          example: baseline-ds-v1
    DemoRunCreateResponse:
      type: object
      required: [demoRunId, studentId, status]
      properties:
        demoRunId:
          type: string
        studentId:
          type: string
        status:
          type: string
          enum: [ACTIVE]
    DemoRunResponse:
      type: object
      required: [demoRunId, demoCaseId, baselineVersion, status, stage, refs]
      properties:
        demoRunId:
          type: string
        demoCaseId:
          type: string
        baselineVersion:
          type: string
        status:
          type: string
          enum: [ACTIVE, RESET]
        stage:
          type: string
        refs:
          type: object
          additionalProperties:
            type: string
        correlationId:
          type: string
    ResetDemoRunResponse:
      type: object
      required: [newDemoRunId, baselineVersion]
      properties:
        newDemoRunId:
          type: string
        baselineVersion:
          type: string
    DemoTraceEvent:
      type: object
      required: [stage, ref, eventTime]
      properties:
        stage:
          type: string
        ref:
          type: string
        eventTime:
          type: string
          format: date-time
    DemoRunTrace:
      type: object
      required: [demoRunId, demoCaseId, baselineVersion, correlationId, stage, refs, events]
      properties:
        demoRunId:
          type: string
        demoCaseId:
          type: string
        baselineVersion:
          type: string
        correlationId:
          type: string
        stage:
          type: string
        refs:
          type: object
          additionalProperties:
            type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/DemoTraceEvent'
    ApiEnvelopeCreateDemoRunResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DemoRunCreateResponse'
    ApiEnvelopeDemoRunResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DemoRunResponse'
    ApiEnvelopeResetDemoRunResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResetDemoRunResponse'
    ApiEnvelopeDemoRunTrace:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DemoRunTrace'
    HealthStatus:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: foundation-api
    LearningStateResponse:
      type: object
      required: [studentId, courseId, knowledgePointId, knowledgePointName, mastery,
                 confidence, forgettingRisk, evidenceCount, lastEvidenceAt, theta,
                 thetaUncertainty, masteryModelVersion, abilityModelVersion,
                 forgettingModelVersion, confidenceModelVersion, weakKnowledgePoints]
      properties:
        studentId:
          type: string
        courseId:
          type: string
        knowledgePointId:
          type: string
        knowledgePointName:
          type: string
        mastery:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        forgettingRisk:
          type: number
          minimum: 0
          maximum: 1
        evidenceCount:
          type: integer
          minimum: 1
        lastEvidenceAt:
          type: string
          format: date-time
        theta:
          type: number
        thetaUncertainty:
          type: number
          exclusiveMinimum: 0
        masteryModelVersion:
          type: string
        abilityModelVersion:
          type: string
        forgettingModelVersion:
          type: string
        confidenceModelVersion:
          type: string
        weakKnowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/WeakKnowledgePointResponse'
    WeakKnowledgePointResponse:
      type: object
      required: [knowledgePointId, name, weaknessScore, confidence, evidenceCount, rank, reasonCodes]
      properties:
        knowledgePointId:
          type: string
        name:
          type: string
        weaknessScore:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidenceCount:
          type: integer
          minimum: 1
        rank:
          type: integer
          minimum: 1
        reasonCodes:
          type: array
          items:
            type: string
    ApiEnvelopeLearningStateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LearningStateResponse'
    GrowthReadModel:
      type: object
      required: [studentId, courseId, mastery, trend, completedTasks, repairedMisconceptions]
      properties:
        studentId:
          type: string
        courseId:
          type: string
        mastery:
          type: number
          minimum: 0
          maximum: 1
        trend:
          type: array
          items:
            type: object
            required: [date, mastery]
            properties:
              date:
                type: string
                format: date
              mastery:
                type: number
                minimum: 0
                maximum: 1
        completedTasks:
          type: integer
          minimum: 0
        repairedMisconceptions:
          type: integer
          minimum: 0
        latestIntervention:
          nullable: true
          type: object
          additionalProperties: true
    ApiEnvelopeGrowthReadModel:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GrowthReadModel'
    CreateCoachSessionRequest:
      type: object
      required: [studentId, courseId]
      properties:
        courseId:
          type: string
        knowledgePointId:
          type: string
        mode:
          type: string
          enum: [TUTOR, DIAGNOSTIC]
        studentId:
          type: string
    CoachLearningContext:
      type: object
      required: [mastery, confidence, forgettingRisk, weaknessScore, modelVersion, sourceVersion]
      properties:
        mastery: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        forgettingRisk: {type: number, minimum: 0, maximum: 1}
        weaknessScore: {type: number, minimum: 0, maximum: 1}
        reasonCodes: {type: string}
        modelVersion: {type: string}
        sourceVersion: {type: string}
    Citation:
      type: object
      required: [documentId, chunkId, title, excerpt, score]
      properties:
        documentId: {type: string}
        chunkId: {type: string}
        title: {type: string}
        excerpt: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
    QuestionOption:
      type: object
      required: [optionId, text]
      properties:
        optionId: {type: string}
        text: {type: string}
    DiagnosticTarget:
      type: object
      required: [code, description]
      properties:
        code: {type: string}
        description: {type: string}
    DiagnosticQuestion:
      type: object
      required: [questionId, knowledgePointId, questionType, stem, options, correctAnswer,
                 explanation, diagnosticTarget, difficulty, citations]
      properties:
        questionId: {type: string}
        knowledgePointId: {type: string}
        questionType:
          type: string
          enum: [SINGLE_CHOICE]
        stem: {type: string}
        options:
          type: array
          items: {$ref: '#/components/schemas/QuestionOption'}
        correctAnswer: {type: string}
        explanation: {type: string}
        diagnosticTarget: {$ref: '#/components/schemas/DiagnosticTarget'}
        difficulty: {type: number, minimum: 0, maximum: 1}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        modelProvider: {type: string}
        modelVersion: {type: string}
        promptVersion: {type: string}
    CoachMessage:
      type: object
      required: [messageId, sessionId, messageType, content, ragStatus, createdAt]
      properties:
        messageId: {type: string}
        sessionId: {type: string}
        messageType: {type: string, enum: [USER, ASSISTANT, ACTION, DIAGNOSTIC]}
        content: {type: string}
        ragStatus: {type: string, enum: [INDEXED, EMPTY, DEGRADED]}
        createdAt: {type: string, format: date-time}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
    CoachSessionResponse:
      type: object
      required: [sessionId, studentId, courseId, mode, status, ragStatus, context, messages, diagnosticQuestions]
      properties:
        sessionId: {type: string}
        studentId: {type: string}
        courseId: {type: string}
        knowledgePointId: {type: string, nullable: true}
        mode: {type: string, enum: [TUTOR, DIAGNOSTIC]}
        status: {type: string, enum: [ACTIVE, CLOSED]}
        ragStatus: {type: string, enum: [INDEXED, EMPTY, DEGRADED]}
        context: {$ref: '#/components/schemas/CoachLearningContext'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/CoachMessage'}
        diagnosticQuestions:
          type: array
          items: {$ref: '#/components/schemas/DiagnosticQuestion'}
    CoachMessageRequest:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1}
    CoachAction:
      type: object
      required: [type, label]
      properties:
        type: {type: string}
        label: {type: string}
    CoachMessageResponse:
      type: object
      required: [assistantMessage, citations, actions, ragStatus]
      properties:
        assistantMessage: {type: string}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        actions:
          type: array
          items: {$ref: '#/components/schemas/CoachAction'}
        ragStatus: {type: string, enum: [INDEXED, EMPTY, DEGRADED]}
    DiagnosticSetRequest:
      type: object
      required: [knowledgePointId, questionCount]
      properties:
        knowledgePointId: {type: string}
        questionCount: {type: integer, enum: [2]}
    DiagnosticSetResponse:
      type: object
      required: [practiceSetId, questionCount, questions, ragStatus]
      properties:
        practiceSetId: {type: string}
        questionCount: {type: integer, enum: [2]}
        questions:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/DiagnosticQuestion'}
        ragStatus: {type: string, enum: [INDEXED, EMPTY, DEGRADED]}
    KnowledgeDocumentRequest:
      type: object
      required: [courseId, title, content]
      properties:
        courseId: {type: string}
        title: {type: string}
        source: {type: string}
        content: {type: string, minLength: 1}
        knowledgePointId: {type: string}
        sourceVersion: {type: string}
        dataOrigin: {type: string}
    KnowledgeDocumentResponse:
      type: object
      required: [documentId, title, status, chunkCount]
      properties:
        documentId: {type: string}
        title: {type: string}
        status: {type: string, enum: [UPLOADED, INDEXED, FAILED]}
        chunkCount: {type: integer, minimum: 0}
    KnowledgeDocumentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeDocumentResponse'}
    ApiEnvelopeCoachSessionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/CoachSessionResponse'}
    ApiEnvelopeCoachMessageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/CoachMessageResponse'}
    ApiEnvelopeDiagnosticSetResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/DiagnosticSetResponse'}
    ApiEnvelopeKnowledgeDocumentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/KnowledgeDocumentResponse'}
    ApiEnvelopeKnowledgeDocumentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: {$ref: '#/components/schemas/KnowledgeDocumentListResponse'}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    DemoRunId:
      name: demoRunId
      in: path
      required: true
      schema:
          type: string
    CoachSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    ResourceNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    StateConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    SessionNotFound:
      description: Coach session not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    AiUpstreamError:
      description: LLM provider unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    RagUnavailable:
      description: Knowledge search unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    UpstreamTimeout:
      description: Upstream timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    LlmOutputInvalid:
      description: Structured LLM output failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
