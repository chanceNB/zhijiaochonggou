        questionId: {type: string}
        selectedAnswer: {type: string, nullable: true}
        correct: {type: boolean}
        responseTimeMs: {type: integer, minimum: 0}
        attemptTime: {type: string, format: date-time}
    PracticeSetResponse:
      type: object
      required: [practiceSetId, studentId, courseId, source, status, questions, attempts]
      properties:
        practiceSetId: {type: string}
        studentId: {type: string}
        courseId: {type: string}
        source:
          type: string
          enum: [AI_COACH_DIAGNOSTIC, AI_COACH_SIMILAR, TEACHER_ASSIGNMENT]
        status:
          type: string
          enum: [OPEN, COMPLETED]
        coachSessionId: {type: string, nullable: true}
        demoCaseId: {type: string, nullable: true}
        questions:
          type: array
          items: {$ref: '#/components/schemas/StudentQuestion'}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/PracticeAttemptSummary'}
    SubmitAttemptRequest:
      type: object
      required: [questionId, answer, durationSeconds]
      properties:
        questionId: {type: string}
        answer:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        durationSeconds: {type: integer, minimum: 1}
    PracticeAttemptResponse:
      type: object
      required: [attemptId, correct, canAddWrongBook, canGenerateSimilar]
      properties:
        attemptId: {type: string}
        correct: {type: boolean}
        correctAnswer: {type: string, nullable: true}
        explanation: {type: string, nullable: true}
        misconceptionCode: {type: string, nullable: true}
        canAddWrongBook: {type: boolean}
        canGenerateSimilar: {type: boolean}
    PracticeOutcome:
      type: object
      required: [outcomeId, practiceSetId, accuracy, attemptCount, learningStateStatus]
      properties:
        outcomeId: {type: string}
        practiceSetId: {type: string}
        accuracy: {type: number, minimum: 0, maximum: 1}
        attemptCount: {type: integer, minimum: 0}
        learningStateStatus: {type: string}
