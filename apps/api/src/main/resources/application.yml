server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: zhijiao-foundation-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zhijiao}
    username: ${DB_USERNAME:zhijiao}
    password: ${DB_PASSWORD:zhijiao_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
    schemas: app,smartbi_exchange
    default-schema: app
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    enabled: ${JWT_ENABLED:false}
    issuer: ${JWT_ISSUER:zhijiao-golden-demo-v2}

app:
  coach:
    llm:
      provider: ${LLM_PROVIDER:openai-compatible}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:gpt-4o-mini}
      timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
      max-diagnostic-retries: ${LLM_MAX_DIAGNOSTIC_RETRIES:1}
      prompt-version: ${LLM_PROMPT_VERSION:coach-prompt-v2}
    rag:
      top-k: ${RAG_TOP_K:4}
      embedding:
        provider: ${EMBEDDING_PROVIDER:openai-compatible}
        base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
        api-key: ${EMBEDDING_API_KEY:}
        model: ${EMBEDDING_MODEL:text-embedding-3-small}
        dimension: ${EMBEDDING_DIMENSION:0}
        timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
  learning:
    bkt:
      initial-mastery: ${BKT_INITIAL_MASTERY:0.20}
      transition: ${BKT_TRANSITION:0.15}
      slip: ${BKT_SLIP:0.10}
      guess: ${BKT_GUESS:0.20}
      model-version: ${BKT_MODEL_VERSION:BKT_V1_FIXED_PARAMS}
    rasch:
      prior-mean: ${RASCH_PRIOR_MEAN:0.0}
      prior-variance: ${RASCH_PRIOR_VARIANCE:1.0}
      difficulty-epsilon: ${RASCH_DIFFICULTY_EPSILON:0.000001}
      max-iterations: ${RASCH_MAX_ITERATIONS:100}
      tolerance: ${RASCH_TOLERANCE:0.0000000001}
      model-version: ${RASCH_MODEL_VERSION:RASCH_MAP_V1}
    forgetting:
      window-days: ${FORGETTING_WINDOW_DAYS:30.0}
      density-target: ${FORGETTING_DENSITY_TARGET:5.0}
      recency-weight: ${FORGETTING_RECENCY_WEIGHT:0.50}
      gap-weight: ${FORGETTING_GAP_WEIGHT:0.20}
      sparsity-weight: ${FORGETTING_SPARSITY_WEIGHT:0.20}
      mastery-weight: ${FORGETTING_MASTERY_WEIGHT:0.10}
      model-version: ${FORGETTING_MODEL_VERSION:RECENCY_GAP_V1}
    confidence:
      evidence-scale: ${CONFIDENCE_EVIDENCE_SCALE:3.0}
      recency-window-days: ${CONFIDENCE_RECENCY_WINDOW_DAYS:30.0}
      evidence-weight: ${CONFIDENCE_EVIDENCE_WEIGHT:0.40}
      uncertainty-weight: ${CONFIDENCE_UNCERTAINTY_WEIGHT:0.25}
      consistency-weight: ${CONFIDENCE_CONSISTENCY_WEIGHT:0.20}
      recency-weight: ${CONFIDENCE_RECENCY_WEIGHT:0.15}
      model-version: ${CONFIDENCE_MODEL_VERSION:STATE_CONFIDENCE_V1}
